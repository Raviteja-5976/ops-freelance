# AWS Amplify Hosting build specification.
#
# This app is server-rendered: middleware guards every route, and the API routes
# under /api use the Supabase service role and nodemailer. Amplify must
# therefore deploy it on the WEB_COMPUTE platform, not as a static site. Amplify
# detects that automatically from the Next.js build output — do not set
# `output: "export"` in next.config.mjs or the API routes and middleware will
# silently stop working.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Match the Node version the app is developed against. Amplify's build
        # image ships nvm; skip quietly if a future image does not.
        - nvm use $(cat .nvmrc) || echo "nvm unavailable, using image default"
        - node --version
        # `npm ci` respects package-lock.json, so a deploy installs exactly what
        # was tested rather than resolving fresh versions.
        - npm ci
        # Fails the build early and loudly when a required variable is missing,
        # rather than shipping a bundle with placeholder values baked in.
        - node scripts/check-env.mjs
    build:
      commands:
        # Amplify injects console environment variables into the BUILD container
        # only. Next.js server code — every /api route handler — reads
        # process.env at REQUEST time, and AWS deliberately withholds those
        # variables from the compute runtime:
        #
        #   "a Next.js server component doesn't have access to those environment
        #    variables by default. This behavior is intentional."
        #   https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        #
        # Without this, RAZORPAY_KEY_ID and SUPABASE_SERVICE_ROLE_KEY are
        # undefined in production even though they are set in the console, and
        # the app reports "Razorpay is not configured on this environment".
        #
        # Writing them to .env.production is the fix AWS documents. The pattern
        # is anchored to the start of the line, so a variable is captured by its
        # name and never because some unrelated value happens to contain the
        # word. The trailing [A-Z0-9_]* lets the first four entries act as
        # prefixes while the rest match in full.
        - rm -f .env.production
        - env | grep -E '^(NEXT_PUBLIC_|RAZORPAY_|SMTP_|EMAIL_|SUPABASE_SERVICE_ROLE_KEY|FOUNDER_EMAIL|INFO_EMAIL)[A-Z0-9_]*=' >> .env.production
        # Log the names captured (never the values) so a missing variable is
        # obvious in the build log instead of surfacing as a runtime error.
        - echo "Runtime env vars written to .env.production: $(cut -d= -f1 .env.production | tr '\n' ' ')"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
